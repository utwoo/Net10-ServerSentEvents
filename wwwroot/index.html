<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSE Monitor</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17221d;
      --muted: #65736b;
      --paper: #f4f6f0;
      --panel: #ffffff;
      --line: #dfe6dd;
      --accent: #d65a38;
      --accent-dark: #a83e25;
      --green: #2d8a62;
      --shadow: 0 18px 50px rgba(29, 49, 38, .1);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font-family: Georgia, "Times New Roman", serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .35;
      background-image: linear-gradient(rgba(36, 60, 44, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(36, 60, 44, .035) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    main { width: min(980px, calc(100% - 36px)); margin: 0 auto; padding: 72px 0 60px; position: relative; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 42px; }
    .eyebrow { color: var(--accent); font: 700 12px/1.2 Arial, sans-serif; letter-spacing: 2px; text-transform: uppercase; }
    h1 { font-size: clamp(42px, 7vw, 76px); line-height: .95; font-weight: 400; letter-spacing: 0; margin: 10px 0 0; }
    .intro { max-width: 280px; margin: 0; color: var(--muted); font: 15px/1.6 Arial, sans-serif; }

    .panel { background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .control-panel { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 22px 26px; }
    .status { display: flex; align-items: center; gap: 11px; font: 700 14px Arial, sans-serif; }
    .dot { width: 11px; height: 11px; border-radius: 50%; background: #aeb9b0; }
    .dot.live { background: var(--green); box-shadow: 0 0 0 5px rgba(45, 138, 98, .13); }
    .actions { display: flex; gap: 10px; }
    button { border: 0; padding: 12px 18px; cursor: pointer; font: 700 13px Arial, sans-serif; }
    #connect { color: white; background: var(--accent); }
    #connect:hover { background: var(--accent-dark); }
    #disconnect { color: var(--ink); background: #edf1eb; }
    button:disabled { cursor: not-allowed; opacity: .45; }

    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 0; }
    .metric { padding: 24px 26px; border-right: 1px solid var(--line); }
    .metric:last-child { border-right: 0; }
    .metric-label { color: var(--muted); font: 11px Arial, sans-serif; letter-spacing: 1px; text-transform: uppercase; }
    .metric-value { display: block; margin-top: 8px; font-size: 32px; font-weight: 400; }

    .log-panel { margin-top: 18px; }
    .log-heading { display: flex; justify-content: space-between; align-items: center; padding: 18px 26px; border-bottom: 1px solid var(--line); }
    h2 { margin: 0; font-size: 20px; font-weight: 400; }
    #clear { color: var(--accent-dark); padding: 4px; background: transparent; }
    #log { min-height: 260px; max-height: 420px; overflow: auto; padding: 8px 26px 18px; }
    .entry { display: grid; grid-template-columns: 84px 1fr; gap: 20px; padding: 14px 0; border-bottom: 1px solid #edf0eb; font: 13px/1.5 Consolas, monospace; }
    .entry time { color: var(--muted); }
    .entry code { color: var(--ink); white-space: pre-wrap; word-break: break-word; }
    .empty { color: var(--muted); font: 14px Arial, sans-serif; padding: 42px 0; text-align: center; }

    @media (max-width: 650px) {
      main { width: min(100% - 24px, 980px); padding-top: 38px; }
      header { display: block; margin-bottom: 28px; }
      .intro { max-width: none; margin-top: 18px; }
      .control-panel { display: block; padding: 18px; }
      .actions { margin-top: 18px; }
      button { flex: 1; }
      .metric { padding: 18px 14px; }
      .metric-value { font-size: 25px; }
      .log-heading, #log { padding-left: 18px; padding-right: 18px; }
      .entry { grid-template-columns: 66px 1fr; gap: 10px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <div class="eyebrow">.NET 10 / Server-Sent Events</div>
        <h1>Live signal.</h1>
      </div>
      <p class="intro">一个最小可运行的 SSE 监视器。服务端每秒发送一个带时间戳的事件。</p>
    </header>

    <section class="panel control-panel" aria-label="连接控制">
      <div class="status"><span id="dot" class="dot"></span><span id="status">未连接</span></div>
      <div class="actions">
        <button id="connect" type="button">建立连接</button>
        <button id="disconnect" type="button" disabled>断开连接</button>
      </div>
    </section>

    <section class="panel metrics" aria-label="事件统计">
      <div class="metric"><span class="metric-label">收到事件</span><strong id="count" class="metric-value">0</strong></div>
      <div class="metric"><span class="metric-label">最后编号</span><strong id="last" class="metric-value">-</strong></div>
      <div class="metric"><span class="metric-label">连接地址</span><strong class="metric-value" style="font-size: 17px; margin-top: 15px">/events</strong></div>
    </section>

    <section class="panel log-panel">
      <div class="log-heading"><h2>事件流</h2><button id="clear" type="button">清空日志</button></div>
      <div id="log"><div class="empty">建立连接后，事件会显示在这里。</div></div>
    </section>
  </main>

  <script>
    let source;
    let count = 0;
    const dot = document.querySelector('#dot');
    const status = document.querySelector('#status');
    const countElement = document.querySelector('#count');
    const lastElement = document.querySelector('#last');
    const log = document.querySelector('#log');
    const connectButton = document.querySelector('#connect');
    const disconnectButton = document.querySelector('#disconnect');

    function setStatus(text, live) {
      status.textContent = text;
      dot.classList.toggle('live', live);
      connectButton.disabled = live;
      disconnectButton.disabled = !live;
    }

    function addEntry(text) {
      const empty = log.querySelector('.empty');
      if (empty) empty.remove();
      const entry = document.createElement('div');
      entry.className = 'entry';
      entry.innerHTML = `<time>${new Date().toLocaleTimeString()}</time><code></code>`;
      entry.querySelector('code').textContent = text;
      log.prepend(entry);
    }

    connectButton.addEventListener('click', () => {
      source = new EventSource('/events');
      source.onopen = () => { setStatus('已连接，正在接收', true); addEntry('连接已建立'); };
      source.addEventListener('tick', event => {
        const data = JSON.parse(event.data);
        count += 1;
        countElement.textContent = count;
        lastElement.textContent = data.number;
        addEntry(event.data);
      });
      source.onerror = () => {
        if (source.readyState === EventSource.CLOSED) setStatus('连接已关闭', false);
        else setStatus('连接异常，正在重试', false);
      };
    });

    disconnectButton.addEventListener('click', () => {
      source?.close();
      setStatus('已断开', false);
      addEntry('连接已断开');
    });

    document.querySelector('#clear').addEventListener('click', () => {
      log.innerHTML = '<div class="empty">建立连接后，事件会显示在这里。</div>';
    });
  </script>
</body>
</html>
